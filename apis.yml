  name: Nakama Realtime Socket API
  tags:
  - Real-Time
  - WebSocket
  - Multiplayer
  - Matchmaking
  - Chat
  tags_raw:
  - Realtime
  - WebSocket
  - Multiplayer
  - Matchmaking
  - Chat
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://heroiclabs.com/docs/nakama/concepts/client-relayed-multiplayer/
  baseURL: ws://127.0.0.1:7350/ws
  properties:
  - url: https://heroiclabs.com/docs/nakama/concepts/client-relayed-multiplayer/
    type: Documentation
  - url: https://heroiclabs.com/docs/nakama/concepts/matches/
    type: Documentation
  - url: asyncapi/nakama-asyncapi.yml
    type: AsyncAPI
  description: >-
    Persistent WebSocket connection carrying realtime features - status presence, realtime chat channels,
    relayed and authoritative multiplayer matches, matchmaking, parties, and realtime notification delivery
    - as envelope messages authenticated with a session token supplied as a query parameter on connect.
