  baseURL: http://127.0.0.1:7350/v2/console
  properties:
  - url: https://heroiclabs.com/docs/nakama/getting-started/console-overview/
    type: Documentation
  description: >-
    Administrative API behind the Nakama Developer Console for managing users, storage, leaderboards,
    matches, runtime configuration, and server status. It is an internal operations surface (not published
    as a stable public client contract) authenticated with console credentials, and is documented here
    for completeness rather than for third-party client integration.
